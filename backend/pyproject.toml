[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the Live Agent Activity Dashboard"
authors = ["Undervalued House Finder Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
python-dotenv = "^1.0.0"
supabase = {version = "^2.4.0", optional = true}

[tool.poetry.extras]
db = ["supabase"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120

[tool.black]
line-length = 120
