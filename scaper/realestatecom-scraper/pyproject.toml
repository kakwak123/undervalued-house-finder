[tool.poetry]
name = "realestate-playwright-scraper"
version = "0.1.0"
description = "realestate.com.au scraper using Playwright + stealth (no Scrapfly)"
authors = ["Undervalued House Finder Contributors"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
playwright = "^1.44.0"
playwright-stealth = "^1.0.6"
jmespath = "^1.0.1"
loguru = "^0.7.1"

[tool.poetry.group.dev.dependencies]
black = "^23.7.0"
ruff = "^0.1.0"
pytest = "^7.3.1"
cerberus = "^1.3.4"
asyncio = "^3.4.3"
pytest-asyncio = "^0.21.0"
pytest-rerunfailures = "^14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
python_files = "test.py test_*.py"
asyncio_mode = "auto"

[tool.black]
line-length = 120
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']

[tool.ruff]
line-length = 120
